name: Build & Deploy to K3s

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build and push Docker image to GHCR
  # Runs on GitHub-hosted runner
  # ──────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ✅ Image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 2: Deploy to K3s cluster
  # Runs on self-hosted runner (K3s master node)
  # ──────────────────────────────────────────────
  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes manifests
        run: |
          echo "📦 Applying K8s manifests..."
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/nodeport-service.yml
          kubectl apply -f k8s/deployment.yml

      - name: Update deployment image
        run: |
          echo "🔄 Updating deployment image to SHA: ${{ needs.build-and-push.outputs.sha_short }}"
          kubectl set image deployment/portfolio \
            portfolio=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha_short }} \
            -n portfolio

      - name: Wait for rollout to complete
        run: |
          echo "⏳ Waiting for rollout to complete..."
          if ! kubectl rollout status deployment/portfolio -n portfolio --timeout=120s; then
            echo "❌ Rollout failed! Initiating rollback..."
            kubectl rollout undo deployment/portfolio -n portfolio
            kubectl rollout status deployment/portfolio -n portfolio --timeout=60s
            echo "🔙 Rollback completed"
            exit 1
          fi
          echo "✅ Rollout completed successfully!"

      - name: Verify deployment
        run: |
          echo "### 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n portfolio -o wide >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Pods:**"
          kubectl get pods -n portfolio -o wide
          echo ""
          echo "**Services:**"
          kubectl get svc -n portfolio
          echo ""
          echo "**Deployment:**"
          kubectl describe deployment portfolio -n portfolio | head -30
