apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app: portfolio
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: portfolio
  # ── Zero-Downtime Rolling Update Strategy ──
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod during update
      maxUnavailable: 0   # Never take down existing pods until new ones are ready
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      # Pull image from GHCR (private registry)
      imagePullSecrets:
        - name: ghcr-secret

      # Spread pods across worker nodes for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - portfolio
                topologyKey: kubernetes.io/hostname

      containers:
        - name: portfolio
          image: ghcr.io/techkanna/nextjs-k3s-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP

          # ── Resource Management ──
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          # ── Environment Variables ──
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"

          # ── Health Checks for Zero-Downtime ──

          # Startup probe: gives the container time to start up
          # Fails after 30s (10 * 3s) if container doesn't start
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 10
            periodSeconds: 3

          # Readiness probe: controls when pod receives traffic
          # Pod is removed from service endpoints if this fails
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Liveness probe: restarts pod if it becomes unhealthy
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

      # Graceful shutdown: give the app time to finish requests
      terminationGracePeriodSeconds: 30
