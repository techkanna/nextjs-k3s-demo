# ============================================================
# GHCR Image Pull Secret for K3s
# ============================================================
#
# DO NOT commit real credentials to this file!
# Instead, create the secret manually on your K3s master node:
#
#   kubectl create namespace portfolio
#
#   kubectl create secret docker-registry ghcr-secret \
#     --namespace=portfolio \
#     --docker-server=ghcr.io \
#     --docker-username=techkanna \
#     --docker-password=<YOUR_GITHUB_PAT> \
#     --docker-email=<YOUR_EMAIL>
#
# To generate a GitHub PAT:
#   1. Go to: https://github.com/settings/tokens?type=beta
#   2. Create a fine-grained token with:
#      - Repository access: techkanna/nextjs-k3s-demo
#      - Permissions: read:packages
#   3. Use the generated token as --docker-password above
#
# To verify the secret was created:
#   kubectl get secret ghcr-secret -n portfolio
#
# To update the secret (e.g., if PAT expires):
#   kubectl delete secret ghcr-secret -n portfolio
#   # Then re-run the create command above
# ============================================================

# This placeholder manifest is for reference only.
# The actual secret should be created using the kubectl command above.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: portfolio
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG>
